# Smithery configuration for @algo-wallet/x402-mcp
# https://smithery.ai
#
# This HTTP transport exposes read-only tools (check_balance, check_mandates).
# pay_with_x402 requires the STDIO transport — the private key must never leave
# the user's device (non-custodial mandate architecture).

startCommand:
  type: http
  configSchema:
    type: object
    required:
      - X402_AGENT_ID
      - X402_PORTAL_KEY
    properties:
      X402_AGENT_ID:
        type: string
        description: "Your agent ID registered at ai-agentic-wallet.com"
      X402_PORTAL_KEY:
        type: string
        description: "Portal API key (pk_live_...) from your dashboard → API Keys"
      X402_API_URL:
        type: string
        description: "Backend URL — leave blank to use the default production server"
        default: "https://api.ai-agentic-wallet.com"
  url: "https://api.ai-agentic-wallet.com/mcp"
  headers:
    X-Agent-Id:   "{{X402_AGENT_ID}}"
    X-Portal-Key: "{{X402_PORTAL_KEY}}"
    X-Api-Url:    "{{X402_API_URL}}"
